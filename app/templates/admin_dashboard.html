<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理搜索 — RUC小喇叭</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
(function() {
  var theme = localStorage.getItem('rucxlb-theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
})();
</script>
<style>
.header { padding: 18px 24px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.header .nav { display: flex; gap: 10px; align-items: center; font-size: var(--ui-font-control); flex-wrap: wrap; }
.header .nav a { text-decoration: none; }
__SHARED_UI_CSS__
html.compact-mode .result-row { padding: 11px 14px; margin-bottom: 7px; }
html.compact-mode .result-row .text { line-height: 1.58; }
html.compact-mode .cmt { padding-top: 4px; padding-bottom: 4px; }
html.hide-stats .post-stats-inline { display: none; }
.filters { max-width: 1040px; margin: 0 auto 10px; padding: 10px 14px; background: #fff; border: 1px solid #eee; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.filter-row { gap: 7px; }
.filter-row + .filter-row { margin-top: 7px; }
.filter-row.primary { gap: 8px; }
.filter-row.primary #q { flex: 1 1 240px; width: auto; min-width: min(100%, 180px); }
.filter-row.primary > button { flex: 0 0 auto; }
.filter-row.primary .search-mode-pill { flex: 0 1 auto; min-width: 100px; }
.control-groups { gap: 8px; align-items: flex-start; }
.control-groups .select-group { flex: 1 1 410px; min-width: min(100%, 410px); }
.control-groups .field-group { flex: 1 1 330px; min-width: min(100%, 330px); }
.control-groups .match-group { flex: 1 1 150px; min-width: min(100%, 150px); }
.control-group { gap: 6px; }
.filters .select-group select { flex: 1 1 92px; min-width: 92px; }
.match-group { justify-content: flex-end; }
.filters input[type=text] { width: 100%; min-width: 0; padding: 7px 11px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; height: 36px; }
.filters .select-group input[type=text] { flex: 1 1 120px; min-width: 120px; max-width: 190px; height: 30px; padding: 4px 9px; border-width: 1px; border-radius: 7px; font-size: var(--ui-font-control); }
.filters select { flex: 1 1 112px; min-width: 112px; max-width: 170px; padding: 4px 9px; border: 1px solid #ddd; border-radius: 7px; font-size: var(--ui-font-control); outline: none; height: 30px; }
.field-toggle { position: relative; }
.filters button { padding: 7px 22px; border: none; border-radius: 8px; background: #8b0012; color: #fff; cursor: pointer; font-size: 14px; white-space: nowrap; height: 36px; }
.filters button:hover { background: #6d000e; }
.search-mode-pill { display: inline-flex; align-items: center; min-height: 26px; max-width: 280px; padding: 2px 10px; border-radius: 999px; background: #f8eeee; color: #8b0012; font-size: var(--ui-font-control); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.match-select { display: none; }
.match-select.active { display: inline-block; flex: 1 1 132px; max-width: 170px; }
#results { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.results { border-radius: 8px; overflow: hidden; }
.result-row { background: #fff; padding: 14px 18px; margin-bottom: 10px; border: 1px solid #eee; border-radius: 8px; transition: box-shadow .15s, border-color .15s, background .15s; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.result-row:hover { border-color: #e6b8bf; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.result-row.expanded { border-color: #d99aa4; background: #fffafa; }
.result-row .top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; font-size: 0.8em; }
.result-row .top .uid { color: #8b0012; font-family: monospace; font-weight: bold; }
.result-row .top .meta { color: #999; }
.result-row .text { line-height: 1.7; color: #222; white-space: pre-wrap; word-break: break-word; font-size: 0.92em; position: relative; }
.result-row .text.expandable { cursor: text; }
.result-row .text.collapsed { max-height: 5.1em; overflow: hidden; }
.result-row .text.collapsed::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2.2em; background: linear-gradient(transparent, #fff); pointer-events: none; }
.text-expand-bar { margin-top: 4px; }
.text-expand-btn { color: #8b0012; cursor: pointer; font-size: 0.82em; user-select: none; }
.text-expand-btn:hover { text-decoration: underline; }
.result-row .stats-row { color: #888; font-size: 0.8em; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.result-row .stats-row.has-comments { cursor: pointer; }
.result-row .stats-row.has-comments:hover .toggle-cmts { text-decoration: underline; }
.post-stats-inline { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.toggle-cmts { color: #8b0012; cursor: pointer; user-select: none; white-space: nowrap; }
.toggle-cmts:hover { text-decoration: underline; }
.identity-pill { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; font-size: 0.82em; font-weight: 600; }
.identity-pill.anonymous { color: #777; background: #f2f2f2; }
.identity-pill.real { color: #2e7d32; background: #eaf6ed; }
.identity-pill.unknown { color: #8a6d3b; background: #fff7df; }
.source-state-pill { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 4px; font-size: 0.82em; font-weight: 700; color: #fff; background: #a32626; }
.deleted-note { margin: 7px 0; padding: 7px 9px; border-left: 3px solid #a32626; background: #fff3f3; color: #7d2020; font-size: 0.82em; }
.comments-panel { display: none; border-left: 2px solid #eee; margin: 10px 0 0 0; padding-left: 12px; cursor: default; }
.comments-panel.open { display: block; }
.cmt { --indent: 0px; position: relative; margin-left: var(--indent); padding: 6px 0 6px 10px; border-bottom: 1px solid #f5f5f5; border-left: 2px solid #eee; font-size: 0.86em; }
.cmt:last-child { border-bottom: none; }
.cmt .cmt-uid { color: #8b0012; font-family: monospace; font-size: 0.85em; }
.cmt .cmt-name { color: #777; font-size: 0.85em; }
.cmt .cmt-text { color: #444; margin-top: 2px; line-height: 1.6; }
.cmt .reply-to { color: #999; font-size: 0.8em; margin-left: 4px; }
.cmt .depth-tag { display: inline-block; min-width: 24px; margin-right: 5px; color: #b46b76; font-size: 0.78em; }
.cmt .nested { margin-top: 4px; }
.pagination { max-width: 1040px; margin: 0 auto; display: flex; justify-content: center; gap: 6px; padding: 16px; flex-wrap: wrap; }
.pagination button { padding: 8px 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #333; cursor: pointer; font-size: 0.85em; }
.pagination button:hover { border-color: #8b0012; color: #8b0012; }
.pagination button.active { background: #8b0012; color: #fff; border-color: #8b0012; }
.pagination button:disabled { opacity: 0.3; cursor: default; }
mark { background: #fff0b3; color: #111; padding: 0 2px; border-radius: 2px; }
.no-results { text-align: center; color: #999; padding: 40px; background: #fff; border-radius: 8px; border: 1px solid #eee; }
.loading { text-align: center; color: #999; padding: 40px; background: #fff; border-radius: 8px; border: 1px solid #eee; }
@media (max-width: 700px) {
  .header { padding: 12px 16px; }
  .filters { padding: 8px; }
  .filter-row:not(.primary) { gap: 5px; }
  .control-group { gap: 5px; }
  .filters input[type=text] { height: 34px; }
  .filters .select-group input[type=text] { height: 30px; padding: 4px 8px; }
  .filters select { height: 30px; padding: 4px 8px; }
  .filters button { height: 34px; padding-left: 16px; padding-right: 16px; }
  .result-row .stats-row { align-items: flex-start; }
  .post-stats-inline { justify-content: flex-start; }
}
.settings-panel { max-height: calc(100vh - 90px); overflow-y: auto; }
.public-access-section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--ui-border); }
.public-access-section h4 { margin: 0 0 6px; font-size: .92em; }
.public-access-help, #public-access-status { margin: 0 0 8px; font-size: var(--ui-font-meta); line-height: 1.5; }
.public-access-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--ui-border); font-size: 14px; }
.public-access-row input { width: 18px; height: 18px; accent-color: var(--ui-accent); }
</style>
</head>
<body>
<div class="header">
  <h2>&#128274; 管理搜索</h2>
  <div class="nav">
    <span id="db-info">__CSV_SOURCE__ · __TOTAL__帖</span>
    <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="切换深色模式" title="切换深色模式"><span class="theme-icon">☾</span></button>
    <button class="settings-toggle" type="button" onclick="openSettings()" aria-label="界面设置" title="界面设置">⚙</button>
    <a href="/admin/ai-search">AI 检索</a>
    <a href="/admin/ai-search/bench">Bench 评测</a>
    <a href="/admin/reports">运行汇报</a>
    <a href="/admin/crawl">人工补爬</a>
    <a href="/" title="打开公开搜索页，保留管理员登录">公开搜索</a>
    <a href="/admin?logout=1" title="注销管理员登录">退出登录</a>
  </div>
</div>

<div class="settings-backdrop" id="settings-backdrop" onclick="if(event.target===this)closeSettings()">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h3 id="settings-title">界面设置</h3>
    <div class="settings-row">
      <label for="set-page-size">每页数量</label>
      <select id="set-page-size"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select>
    </div>
    <div class="settings-row">
      <label for="set-truncate-len">正文折叠字数</label>
      <select id="set-truncate-len"><option value="100">100</option><option value="140">140</option><option value="200">200</option><option value="0">不折叠</option></select>
    </div>
    <div class="settings-row">
      <label for="set-comment-limit">评论默认显示</label>
      <select id="set-comment-limit"><option value="20">前 20 条</option><option value="50">前 50 条</option><option value="0">全部</option></select>
    </div>
    <div class="settings-row">
      <label for="set-show-stats">显示点赞/评论数</label>
      <input type="checkbox" id="set-show-stats">
    </div>
    <div class="settings-row">
      <label for="set-compact-mode">紧凑模式</label>
      <input type="checkbox" id="set-compact-mode">
    </div>
    <div class="settings-actions">
      <button type="button" onclick="closeSettings()">取消</button>
      <button type="button" class="primary" onclick="saveSettings()">保存</button>
    </div>
    <section id="public-access-section" class="public-access-section" aria-labelledby="public-access-title">
      <h4 id="public-access-title">普通访客权限 · 全站生效</h4>
      <p class="public-access-help">控制所有未登录访客的查看与搜索范围。真实用户 ID 仍仅管理员可见。</p>
      <label class="public-access-row" for="public-body-view"><span>允许查看帖子正文</span><input id="public-body-view" type="checkbox"></label>
      <label class="public-access-row" for="public-body-search"><span>允许搜索帖子正文</span><input id="public-body-search" type="checkbox"></label>
      <label class="public-access-row" for="public-comments-view"><span>允许展开查看评论</span><input id="public-comments-view" type="checkbox"></label>
      <label class="public-access-row" for="public-comments-search"><span>允许搜索评论</span><input id="public-comments-search" type="checkbox"></label>
      <label class="public-access-row" for="public-deleted-records"><span>允许访问已删除/不可访问记录</span><input id="public-deleted-records" type="checkbox"></label>
      <p class="public-access-help">当前数据把“已删除”和“不可访问”合并管理。保存后接口立即执行新权限，公开页面刷新后更新控件。</p>
      <div id="public-access-status" role="status" aria-live="polite">打开此设置时读取当前权限。</div>
      <div class="settings-actions">
        <button type="button" class="primary" id="save-public-access" onclick="savePublicAccessSettings()">保存访客权限</button>
      </div>
    </section>
  </div>
</div>


<div class="filters">
  <div class="filter-row primary ui-flow">
    <input type="text" id="q" placeholder="搜索关键词（空格 AND）..." autofocus>
    <button onclick="startSearch()">搜索</button>
    <span class="search-mode-pill" id="search-mode">正文检索</span>
  </div>
  <div class="filter-row control-groups ui-flow">
    <div class="control-group select-group ui-flow">
      <select id="sort"><option value="time">按时间</option><option value="stars">按点赞</option><option value="comments">按评论</option><option value="score">综合</option></select>
      <div class="date-filter" id="date-filter" data-preset="1d">
        <button type="button" class="date-filter-trigger" id="date-filter-trigger" aria-controls="date-range-panel" aria-expanded="false">
          <span class="date-filter-icon" aria-hidden="true">▦</span>
          <span id="date-filter-summary">今天</span>
          <span aria-hidden="true">⌄</span>
        </button>
      </div>
      <select id="identity"><option value="">匿名/实名</option><option value="anonymous">仅看匿名帖</option><option value="real">仅看实名帖</option></select>
      <select id="source-state"><option value="all">正常及已删除</option><option value="available">仅正常</option><option value="deleted">仅已删除</option></select>
      <input type="text" id="category" list="category-options" placeholder="全部分类 / 输入tag" aria-label="分类">
      <datalist id="category-options"></datalist>
    </div>
    <div class="control-group field-group ui-flow">
      <label class="field-toggle ui-choice"><input type="checkbox" id="sc-body" checked>正文/帖子侧</label>
      <label class="field-toggle ui-choice"><input type="checkbox" id="sc-cmt">评论侧</label>
      <label class="field-toggle ui-choice"><input type="checkbox" id="sc-uid">用户ID</label>
      <label class="field-toggle ui-choice"><input type="checkbox" id="sc-post">帖子号</label>
      <label class="field-toggle ui-choice"><input type="checkbox" id="sc-name">昵称</label>
    </div>
    <div class="control-group match-group ui-flow">
      <select class="match-select" id="id-match" aria-label="用户ID匹配方式"><option value="exact">用户ID精确</option><option value="contains">用户ID包含</option></select>
      <select class="match-select" id="name-match" aria-label="昵称匹配方式"><option value="exact">昵称精确</option><option value="contains">昵称包含</option></select>
    </div>
  </div>
  <div class="date-range-panel" id="date-range-panel" hidden>
    <div class="date-range-heading">
      <div><div class="date-range-title">按日期筛选</div><div class="date-range-help">筛选帖子发布时间；首尾日期均包含，留空表示不限制这一侧</div></div>
      <button type="button" class="date-range-close" id="date-range-close" aria-label="关闭日期筛选">×</button>
    </div>
    <div class="date-presets" role="group" aria-label="快捷时间范围">
      <button type="button" class="date-preset-button" data-date-preset="1d">今天</button>
      <button type="button" class="date-preset-button" data-date-preset="3d">近3天</button>
      <button type="button" class="date-preset-button" data-date-preset="7d">近7天</button>
      <button type="button" class="date-preset-button" data-date-preset="30d">近30天</button>
      <button type="button" class="date-preset-button" data-date-preset="">不限时间</button>
    </div>
    <div class="date-range-fields">
      <label>开始日期<input type="date" id="date-from"></label>
      <span class="date-range-separator" aria-hidden="true">至</span>
      <label>结束日期<input type="date" id="date-to"></label>
    </div>
    <div class="date-range-error" id="date-range-error" aria-live="polite"></div>
    <div class="date-range-actions">
      <button type="button" id="date-range-clear">清除筛选</button>
      <button type="button" class="primary" id="date-range-apply">应用日期</button>
    </div>
  </div>
</div>

<div id="results"><div class="loading">输入关键词后点击搜索</div></div>
<div class="pagination" id="pager"></div>

<script>
var onUiSettingsSaved = function() { startSearch(); };
var onSettingsOpened = function() { loadPublicAccessSettings(); };
var adminCsrfToken = '__ADMIN_CSRF_TOKEN__';
__SHARED_UI_JS__
updateThemeButton();


var currentPage = 1;
var currentKW = [];
var commentsLoaded = {};
var contentExpanded = {};
var paginationMode = 'numbered';
var cursorPages = [{offset: 0, matchedBefore: 0}];
var pageCache = {};
var searchController = null;
var PAGE_SIZE = 50;
var TRUNCATE_LEN = 140;
applySettings();

function setPublicAccessInputs(settings) {
  document.getElementById('public-body-view').checked = !!settings.body_view;
  document.getElementById('public-body-search').checked = !!settings.body_search;
  document.getElementById('public-comments-view').checked = !!settings.comments_view;
  document.getElementById('public-comments-search').checked = !!settings.comments_search;
  document.getElementById('public-deleted-records').checked = !!settings.deleted_records;
}

function parseAdminJson(response) {
  return response.json().then(function(data) {
    if (!response.ok) throw new Error(data.error || '请求失败');
    if (data.csrf_token) adminCsrfToken = data.csrf_token;
    return data;
  });
}

function loadPublicAccessSettings() {
  var status = document.getElementById('public-access-status');
  status.textContent = '正在读取全站访客权限…';
  fetch('/api/admin/public-access', {cache: 'no-store'})
    .then(parseAdminJson)
    .then(function(data) {
      setPublicAccessInputs(data.settings || {});
      status.textContent = '已读取当前全站权限。';
    })
    .catch(function(error) {
      status.textContent = '读取失败：' + error.message;
    });
}

function savePublicAccessSettings() {
  var status = document.getElementById('public-access-status');
  var button = document.getElementById('save-public-access');
  var settings = {
    body_view: document.getElementById('public-body-view').checked,
    body_search: document.getElementById('public-body-search').checked,
    comments_view: document.getElementById('public-comments-view').checked,
    comments_search: document.getElementById('public-comments-search').checked,
    deleted_records: document.getElementById('public-deleted-records').checked
  };
  button.disabled = true;
  status.textContent = '正在保存…';
  fetch('/api/admin/public-access', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRF-Token': adminCsrfToken},
    body: JSON.stringify(settings)
  })
    .then(parseAdminJson)
    .then(function(data) {
      setPublicAccessInputs(data.settings || settings);
      status.textContent = '已保存。新请求立即执行；公开页面刷新后更新控件。';
    })
    .catch(function(error) {
      status.textContent = '保存失败：' + error.message;
    })
    .finally(function() { button.disabled = false; });
}

function startSearch() {
  currentPage = 1;
  cursorPages = [{offset: 0, matchedBefore: 0}];
  pageCache = {};
  commentsLoaded = {};
  contentExpanded = {};
  doSearch();
}

function parseJsonResponse(response) {
  return response.text().then(function(text) {
    var contentType = response.headers.get('content-type') || '';
    if (!response.ok) {
      throw new Error('HTTP ' + response.status + ': ' + (text || response.statusText));
    }
    if (contentType.indexOf('application/json') < 0) {
      throw new Error(text || '服务器返回了非 JSON 响应');
    }
    try {
      return JSON.parse(text);
    } catch (err) {
      throw new Error('服务器返回了无法解析的数据');
    }
  });
}

function saveAdminPage() {
  var results = document.getElementById('results');
  if (!results || results.querySelector('.loading')) return;
  pageCache[currentPage] = {
    html: results.innerHTML,
    data: results._data,
    commentsLoaded: Object.assign({}, commentsLoaded),
    contentExpanded: Object.assign({}, contentExpanded)
  };
}

function goAdminPage(page) {
  if (page < 1) return;
  saveAdminPage();
  currentPage = page;
  if (pageCache[page]) {
    var cached = pageCache[page];
    var results = document.getElementById('results');
    results.innerHTML = cached.html;
    results._data = cached.data;
    commentsLoaded = Object.assign({}, cached.commentsLoaded);
    contentExpanded = Object.assign({}, cached.contentExpanded || {});
    renderPager(cached.data);
    window.scrollTo({top: 0, behavior: 'smooth'});
    return;
  }
  doSearch();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function doSearch() {
  updateSearchMode();
  commentsLoaded = {};
  contentExpanded = {};
  var q = document.getElementById('q').value.trim();
  currentKW = q ? q.split(/\s+/).filter(Boolean) : [];
  var sort = document.getElementById('sort').value;
  var identity = document.getElementById('identity').value;
  var sourceState = document.getElementById('source-state').value;
  var category = document.getElementById('category').value;

  var cursor = cursorPages[currentPage - 1] || {offset: 0, matchedBefore: 0};
  var params = [
    'q=' + encodeURIComponent(q), 'sort=' + sort,
    'page=' + currentPage, 'limit=' + PAGE_SIZE, 'cursor=1',
    'scan_offset=' + cursor.offset,
    'matched_before=' + cursor.matchedBefore,
    'admin_required=1'
  ];
  params.push.apply(params, getDateFilterParams());
  if (identity) params.push('identity=' + identity);
  if (sourceState && sourceState !== 'all') params.push('source_state=' + sourceState);
  if (category) params.push('category=' + encodeURIComponent(category));

  // body/cmt select the data location. When uid/name/post is selected they do
  // not also add a text-content OR condition.
  var scopes = [];
  if (document.getElementById('sc-body').checked) scopes.push('body');
  if (document.getElementById('sc-cmt').checked) scopes.push('cmt');
  if (document.getElementById('sc-uid').checked) scopes.push('uid');
  if (document.getElementById('sc-post').checked) scopes.push('post');
  if (document.getElementById('sc-name').checked) scopes.push('name');
  if (scopes.length === 0) scopes.push('body');
  params.push('admin_fields=' + scopes.join(','));
  if (scopes.indexOf('uid') >= 0) params.push('id_match=' + document.getElementById('id-match').value);
  if (scopes.indexOf('name') >= 0) params.push('name_match=' + document.getElementById('name-match').value);
  if (scopes.indexOf('cmt') >= 0) params.push('scope=all');
  else params.push('scope=content');

  document.getElementById('results').innerHTML = '<div class="loading">搜索中...</div>';
  if (searchController) searchController.abort();
  searchController = new AbortController();

  fetch('/api/search?' + params.join('&'), {signal: searchController.signal})
    .then(parseJsonResponse)
    .then(data => {
      currentPage = data.page;
      paginationMode = data.pagination_mode || 'numbered';
      commentsLoaded = {};
      renderResults(data);
      document.getElementById('results')._data = data;
      if (paginationMode === 'cursor' && data.has_more) {
        cursorPages[currentPage] = {
          offset: data.next_offset,
          matchedBefore: data.matched_so_far
        };
      }
      renderPager(data);
    })
    .catch(e => {
      if (e.name === 'AbortError') return;
      var message = e && e.message && e.message.indexOf('HTTP ') === 0
        ? (e.message.indexOf('HTTP 401') === 0 ? '管理员登录已失效，请重新登录' : e.message)
        : '搜索超时或连接中断，请缩小搜索范围；特殊符号/单字搜索可能较慢。';
      document.getElementById('results').innerHTML = '<div class="no-results">' + message + '</div>';
    });
}

function highlight(text) {
  var t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  currentKW.forEach(k => {
    var re = new RegExp('(' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    t = t.replace(re, '<mark>$1</mark>');
  });
  return t;
}

function truncateContent(text) {
  text = text || '';
  if (TRUNCATE_LEN <= 0) return { truncated: false, preview: text };
  if (text.length <= TRUNCATE_LEN) return { truncated: false, preview: text };
  return { truncated: true, preview: text.substring(0, TRUNCATE_LEN) + '...' };
}

function renderResults(data) {
  if (!data.results || data.results.length === 0) {
    document.getElementById('results').innerHTML = '<div class="no-results">无结果</div>';
    return;
  }
  var html = '';
  data.results.forEach(function(p, idx) {
    var hasAdminId = Object.prototype.hasOwnProperty.call(p, 'show_user_id');
    var uid = hasAdminId ? (p.show_user_id || '?') : '未返回';
    var ruid = Object.prototype.hasOwnProperty.call(p, 'real_user_id') ? String(p.real_user_id || '0') : null;
    var idTag = uid;
    var postIdentity = ruid === null
      ? '<span class="identity-pill unknown">ID未返回</span>'
      : ((ruid === '0' || !ruid)
        ? '<span class="identity-pill anonymous">匿名</span>'
        : '<span class="identity-pill real">实名</span>');
    var isDeleted = p.source_state === 'deleted_or_unavailable';
    var sourceTag = isDeleted ? '<span class="source-state-pill">已删除/不可访问</span>' : '';
    if (ruid !== null && ruid !== '0' && ruid !== uid) idTag += ' <span style="color:#8b0012">real:' + ruid + '</span>';
    var fullContent = p.content || '';
    var textState = truncateContent(fullContent);
    var textShown = textState.truncated ? textState.preview : fullContent;
    var textClass = 'text' + (textState.truncated ? ' collapsed expandable' : '');
    var textClick = textState.truncated ? ' onclick="event.stopPropagation(); toggleContent(' + idx + ')"' : '';
    var expandText = textState.truncated
      ? '<div class="text-expand-bar"><span class="text-expand-btn" id="text-btn-' + idx + '" onclick="event.stopPropagation(); toggleContent(' + idx + ')">▶ 展开全文 (' + fullContent.length + '字)</span></div>'
      : '';
    html += '<div class="result-row">';
    html += '<div class="top"><span class="uid">ID:' + idTag + postIdentity + sourceTag + '</span><span class="uname" style="color:#777">' + (p.user||'?') + '</span><span class="meta">' + (p.category||'?') + ' &middot; #' + p.id + ' &middot; ' + (p.time||'?').slice(0,16) + '</span></div>';
    if (isDeleted) {
      var savedRows = p.archived_comment_rows || 0;
      var savedText = savedRows > 0
        ? '本站保存 ' + savedRows + ' 条评论/回复记录。'
        : '本站未能保存评论内容。';
      var detailText = p.crawl_status === 'list_only' && !fullContent
        ? '本站仅保存了列表记录，正文详情未抓取。'
        : '';
      html += '<div class="deleted-note">源端已删除或不可访问；删除前最后观察到 ' + (p.comments||0) + ' 条评论。' + savedText + detailText + '</div>';
    }
    html += '<div class="' + textClass + '" id="text-' + idx + '"' + textClick + '>' + highlight(textShown) + '</div>';
    html += expandText;
    var expandableComments = isDeleted ? (p.archived_comment_rows > 0) : (p.comments > 0);
    var cmtLabel = isDeleted ? (p.archived_comment_rows || 0) + ' 条本地评论/回复' : p.comments + ' 条评论';
    var cmtToggle = expandableComments ? '<span class="toggle-cmts" id="cmt-btn-' + idx + '" onclick="event.stopPropagation(); toggleCmts(' + idx + ')">▶ 展开 ' + cmtLabel + '</span>' : '<span></span>';
    var statsClick = expandableComments ? ' onclick="toggleCmts(' + idx + ')"' : '';
    html += '<div class="stats-row' + (expandableComments ? ' has-comments' : '') + '"' + statsClick + '>' + cmtToggle + '<span class="post-stats-inline"><span>❤ ' + (p.stars||0) + '</span><span>💬 ' + (p.comments||0) + '</span></span></div>';
    html += '<div class="comments-panel" id="cmts-' + idx + '" onclick="event.stopPropagation()"></div>';
    html += '</div>';
  });
  document.getElementById('results').innerHTML = html;
  document.getElementById('results')._data = data;
}

function toggleContent(idx) {
  var data = document.getElementById('results')._data;
  if (!data || !data.results || !data.results[idx]) return;
  var fullContent = data.results[idx].content || '';
  var state = truncateContent(fullContent);
  if (!state.truncated) return;
  var textEl = document.getElementById('text-' + idx);
  var btn = document.getElementById('text-btn-' + idx);
  if (!textEl) return;
  var expanded = !contentExpanded[idx];
  contentExpanded[idx] = expanded;
  if (expanded) {
    textEl.classList.remove('collapsed');
    textEl.innerHTML = highlight(fullContent);
    if (btn) btn.textContent = '▼ 收起正文';
  } else {
    textEl.classList.add('collapsed');
    textEl.innerHTML = highlight(state.preview);
    if (btn) btn.textContent = '▶ 展开全文 (' + fullContent.length + '字)';
  }
}

function renderComments(panel, comments, commentState) {
  if (!comments || comments.length === 0) {
    if (commentState === 'not_crawled') return '尚未爬取';
    if (commentState === 'incomplete') return '评论尚未完整爬取';
    return '暂无评论';
  }
  var limit = uiSettings.commentLimit || 0;
  var hiddenTopLevel = limit > 0 && comments.length > limit ? comments.length - limit : 0;
  var visibleComments = hiddenTopLevel > 0 ? comments.slice(0, limit) : comments;
  function renderLevel(items, depth) {
    var h = '';
    items.forEach(function(c, index) {
      var children = c.children || c.reply_comment_list || [];
      var visualDepth = Math.min(depth, 4);
      var marker = depth === 0
        ? '<b style="color:#8b0012;">#' + (index + 1) + '</b> '
        : (depth === 1
          ? '<span class="depth-tag">回复</span>'
          : '<span class="depth-tag">L' + (depth + 1) + (depth >= 4 ? '+' : '') + '</span>');
      h += '<div class="cmt" data-depth="' + depth + '" style="--indent:' + (visualDepth * 14) + 'px">';
      h += marker + '<span class="cmt-uid">' + (c.show_user_id||'?') + '</span> ';
      h += identityPill(c.real_user_id, c.hasOwnProperty('real_user_id'));
      h += '<span class="cmt-name">' + (c.show_user_name||'?') + '</span>';
      if (c.is_publisher == 1) h += ' <span style="color:#8b0012">楼主</span>';
      if (c.reply_show_user_id) h += '<span class="reply-to">→ ' + (c.reply_show_user_name||c.reply_show_user_id||'?') + '</span>';
      h += '<div class="cmt-text">' + highlight(c.detail||'') + '</div>';
      if (children.length > 0) h += '<div class="nested">' + renderLevel(children, depth + 1) + '</div>';
      h += '</div>';
    });
    return h;
  }
  var html = renderLevel(visibleComments, 0);
  if (hiddenTopLevel > 0) {
    html += '<div class="loading">已显示前 ' + limit + ' 条顶层评论，另有 ' + hiddenTopLevel + ' 条可在设置中改为全部显示</div>';
  }
  return html;
}

function identityPill(realUserId, known) {
  if (!known) return '<span class="identity-pill unknown">ID未返回</span> ';
  var ruid = String(realUserId || '0');
  if (ruid === '0') return '<span class="identity-pill anonymous">匿名</span> ';
  return '<span class="identity-pill real">实名</span> ';
}

function toggleCmts(idx) {
  var panel = document.getElementById('cmts-' + idx);
  var btn = document.getElementById('cmt-btn-' + idx);
  var row = panel ? panel.closest('.result-row') : null;
  var data = document.getElementById('results')._data;
  if (!data || !data.results || !data.results[idx]) return;
  var target = data.results[idx];
  var canExpand = target.source_state === 'deleted_or_unavailable'
    ? target.archived_comment_rows > 0
    : target.comments > 0;
  if (!canExpand) return;
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    if (row) row.classList.remove('expanded');
    if (btn) btn.textContent = target.source_state === 'deleted_or_unavailable'
      ? '▶ 展开 ' + (target.archived_comment_rows || 0) + ' 条本地评论/回复'
      : '▶ 展开 ' + target.comments + ' 条评论';
    return;
  }
  var p = data.results[idx];
  panel.classList.add('open');
  if (row) row.classList.add('expanded');
  if (btn) btn.textContent = '▼ 收起评论';
  if (commentsLoaded[idx]) return;
  panel.innerHTML = '<div class="loading">加载评论...</div>';
  fetch('/api/comments?id=' + encodeURIComponent(p.id) + '&admin_required=1')
    .then(parseJsonResponse)
    .then(function(payload) {
      panel.innerHTML = renderComments(panel, payload.comment_list || [], payload.comment_state);
      commentsLoaded[idx] = true;
    })
    .catch(function(err) {
      var msg = (err.message || String(err));
      if (msg.indexOf('HTTP 401') === 0) msg = '管理员登录已失效，请重新登录';
      panel.innerHTML = '<div class="no-results">评论加载失败: ' + highlight(msg) + '</div>';
    });
}

function renderPager(data) {
  var h = '';
  if (data.pagination_mode === 'cursor') {
    h += '<button ' + (data.page <= 1 ? 'disabled' : '') +
      ' onclick="goAdminPage(' + (data.page - 1) + ')">上一页</button>';
    h += '<span style="color:#666;font-size:0.82em;">第 ' + data.page + ' 页</span>';
    h += '<button ' + (!data.has_more ? 'disabled' : '') +
      ' onclick="goAdminPage(' + (data.page + 1) + ')">下一页</button>';
    h += '<span style="color:#888;font-size:0.8em;margin-left:8px;">' +
      (data.total_exact ? '共 ' + data.total + ' 条' : '本页 ' + (data.results || []).length + ' 条') +
      '</span>';
    document.getElementById('pager').innerHTML = h;
    return;
  }
  if (data.total_pages <= 1) { document.getElementById('pager').innerHTML = ''; return; }
  h += '<button ' + (data.page <= 1 ? 'disabled' : '') + ' onclick="goAdminPage(1)">首页</button>';
  h += '<button ' + (data.page <= 1 ? 'disabled' : '') + ' onclick="goAdminPage(' + (data.page-1) + ')">上一页</button>';
  var start = Math.max(1, data.page - 3);
  var end = Math.min(data.total_pages, data.page + 3);
  for (var i = start; i <= end; i++) {
    h += '<button class="' + (i === data.page ? 'active' : '') + '" onclick="goAdminPage(' + i + ')">' + i + '</button>';
  }
  h += '<button ' + (data.page >= data.total_pages ? 'disabled' : '') + ' onclick="goAdminPage(' + (data.page+1) + ')">下一页</button>';
  h += '<button ' + (data.page >= data.total_pages ? 'disabled' : '') + ' onclick="goAdminPage(' + data.total_pages + ')">末页</button>';
  h += '<span style="color:#888;font-size:0.8em;margin-left:8px;">共 ' + data.total + ' 条 / ' + data.total_pages + ' 页</span>';
  document.getElementById('pager').innerHTML = h;
}

// Enter key triggers search
document.getElementById('q').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') startSearch();
});

function updateSearchMode() {
  var fields = [];
  var locations = [];
  var hasIdentityField = document.getElementById('sc-uid').checked ||
    document.getElementById('sc-post').checked ||
    document.getElementById('sc-name').checked;
  if (document.getElementById('sc-uid').checked) {
    fields.push('用户ID' + (document.getElementById('id-match').value === 'contains' ? '包含' : '精确'));
  }
  if (document.getElementById('sc-post').checked) fields.push('帖子号精确');
  if (document.getElementById('sc-name').checked) {
    fields.push('昵称' + (document.getElementById('name-match').value === 'contains' ? '包含' : '精确'));
  }
  if (document.getElementById('sc-body').checked) locations.push('帖子侧');
  if (document.getElementById('sc-cmt').checked) locations.push('评论侧');
  if (!hasIdentityField) {
    fields.push('文本');
  }
  var mode = fields.join(' + ');
  if (!document.getElementById('sc-post').checked || fields.length > 1) {
    mode += ' · 范围：' + (locations.length ? locations.join('+') : '帖子侧');
  }
  document.getElementById('search-mode').textContent = mode;
  document.getElementById('id-match').classList.toggle('active', document.getElementById('sc-uid').checked);
  document.getElementById('name-match').classList.toggle('active', document.getElementById('sc-name').checked);
}

document.getElementById('sc-uid').addEventListener('change', function() {
  if (this.checked) {
    document.getElementById('sc-name').checked = false;
    document.getElementById('sc-post').checked = false;
  }
  updateSearchMode();
});

document.getElementById('sc-post').addEventListener('change', function() {
  if (this.checked) {
    document.getElementById('sc-uid').checked = false;
    document.getElementById('sc-name').checked = false;
  }
  updateSearchMode();
});

document.getElementById('sc-name').addEventListener('change', function() {
  if (this.checked) {
    document.getElementById('sc-uid').checked = false;
    document.getElementById('sc-post').checked = false;
  }
  updateSearchMode();
});

['sc-body', 'sc-cmt', 'id-match', 'name-match'].forEach(function(id) {
  document.getElementById(id).addEventListener('change', updateSearchMode);
});
['sort', 'identity'].forEach(function(id) {
  document.getElementById(id).addEventListener('change', startSearch);
});
var categoryTimer = null;
document.getElementById('category').addEventListener('input', function() {
  clearTimeout(categoryTimer);
  categoryTimer = setTimeout(startSearch, 350);
});
updateSearchMode();
var linkedPost = new URLSearchParams(window.location.search).get('post');
if (linkedPost && linkedPost.length <= 128) {
  document.getElementById('date-filter').dataset.preset = '';
}
setupDateFilter(startSearch);

fetch('/api/categories')
  .then(parseJsonResponse)
  .then(function(data) {
    var sel = document.getElementById('category-options');
    var counts = data.category_counts || {};
    (data.categories || []).forEach(function(category) {
      var opt = document.createElement('option');
      opt.value = category;
      if (counts[category]) opt.label = category + ' · ' + counts[category];
      sel.appendChild(opt);
    });
  })
  .catch(function() {});

if (linkedPost && linkedPost.length <= 128) {
  document.getElementById('q').value = linkedPost;
  ['body', 'cmt', 'uid', 'post', 'name'].forEach(function(field) {
    document.getElementById('sc-' + field).checked = field === 'body' || field === 'post';
  });
  startSearch();
}
</script>
